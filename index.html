<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Narayanganj - শহরের সবকিছু এক ঠিকানায়</title>
  
  <!-- গুগল ফন্ট: Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- ফন্ট অসাম আইকন -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    /* স্ক্রলবার লুকানোর ইউটিলিটি */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-800 flex justify-center min-h-screen">

  <!-- মোবাইল ফ্রেম কন্টেইনার (ম্যাক্সিমাম ৪৮০ পিক্সেল) -->
  <div class="w-full max-w-md bg-slate-50 min-h-screen flex flex-col relative pb-20 shadow-xl border-x border-slate-200">

    <!-- গ্লোবাল টপ হেডার -->
    <header class="bg-emerald-800 text-white px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
        <div class="w-8 h-8 rounded-lg bg-emerald-700 flex items-center justify-center text-amber-400 font-bold">
          <i class="fa-solid fa-city"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm leading-tight">The Narayanganj</h1>
          <p class="text-[10px] text-emerald-200">শহরের সবকিছু এক ঠিকানায়</p>
        </div>
      </div>
      <button onclick="navigateTo('bookmarks')" class="w-8 h-8 rounded-full bg-emerald-700 flex items-center justify-center text-white text-xs hover:bg-emerald-600 transition">
        <i class="fa-regular fa-bookmark"></i>
      </button>
    </header>

    <!-- গ্লোবাল স্পিনার / লোডার -->
    <div id="global-loader" class="hidden fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 flex items-center justify-center">
      <div class="bg-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3">
        <i class="fa-solid fa-circle-notch fa-spin text-emerald-700 text-xl"></i>
        <span class="text-xs font-bold text-slate-700">তথ্য লোড হচ্ছে...</span>
      </div>
    </div>

    <!-- মূল ভিউসমূহ (SPA Views) -->
    <main class="flex-1 p-3.5">
      
      <!-- ১. হোম ভিউ -->
      <section id="view-home" class="app-page">
        <div id="home-content"></div>
      </section>

      <!-- ২. শিক্ষা প্রতিষ্ঠান ভিউ -->
      <section id="view-education" class="app-page hidden">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <button onclick="navigateTo('home')" class="text-slate-500 hover:text-slate-800 text-xs">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 class="font-bold text-slate-800 text-sm">শিক্ষা প্রতিষ্ঠানসমূহ</h2>
          </div>
          <span class="text-[10px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-full">ব্যানবেইস ডেটাবেজ</span>
        </div>
        <div id="education-content"></div>
      </section>

      <!-- ৩. শিক্ষা প্রতিষ্ঠান ডিটেইলস ভিউ -->
      <section id="view-education-details" class="app-page hidden">
        <div id="education-details-content"></div>
      </section>

      <!-- ৪. ডাক্তার ভিউ -->
      <section id="view-doctors" class="app-page hidden">
        <div class="flex items-center gap-2 mb-3">
          <button onclick="navigateTo('home')" class="text-slate-500 hover:text-slate-800 text-xs">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <h2 class="font-bold text-slate-800 text-sm">বিশেষজ্ঞ ডাক্তার তালিকা</h2>
        </div>
        <div id="doctors-content"></div>
      </section>

      <!-- ৫. ডাক্তার ডিটেইলস ভিউ -->
      <section id="view-doctor-details" class="app-page hidden">
        <div id="doctor-details-content"></div>
      </section>

      <!-- ৬. সাধারণ প্রতিষ্ঠান ডিটেইলস ভিউ -->
      <section id="view-item-details" class="app-page hidden">
        <div id="item-details-content"></div>
      </section>

      <!-- ৭. বুকমার্ক ভিউ -->
      <section id="view-bookmarks" class="app-page hidden">
        <div class="flex items-center gap-2 mb-3">
          <button onclick="navigateTo('home')" class="text-slate-500 hover:text-slate-800 text-xs">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <h2 class="font-bold text-slate-800 text-sm">সংরক্ষিত তালিকা (বুকমার্ক)</h2>
        </div>
        <div id="bookmarks-content" class="text-xs text-slate-400 text-center p-8">
          কোনো তথ্য বুকমার্কে সংরক্ষিত নেই।
        </div>
      </section>

    </main>

    <!-- বটম ফিক্সড নেভিগেশন বার -->
    <nav class="fixed bottom-0 max-w-md w-full bg-white border-t border-slate-200 px-4 py-2 z-30 flex justify-between items-center shadow-lg">
      <button onclick="navigateTo('home')" class="bottom-nav-item flex flex-col items-center flex-1 text-emerald-700 font-bold" data-target="home">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[10px] mt-0.5">হোম</span>
      </button>

      <button onclick="navigateTo('education')" class="bottom-nav-item flex flex-col items-center flex-1 text-slate-500" data-target="education">
        <i class="fa-solid fa-graduation-cap text-base"></i>
        <span class="text-[10px] mt-0.5">শিক্ষা</span>
      </button>

      <button onclick="navigateTo('doctors')" class="bottom-nav-item flex flex-col items-center flex-1 text-slate-500" data-target="doctors">
        <i class="fa-solid fa-user-doctor text-base"></i>
        <span class="text-[10px] mt-0.5">ডাক্তার</span>
      </button>

      <button onclick="navigateTo('bookmarks')" class="bottom-nav-item flex flex-col items-center flex-1 text-slate-500" data-target="bookmarks">
        <i class="fa-regular fa-bookmark text-base"></i>
        <span class="text-[10px] mt-0.5">ফেভারিট</span>
      </button>
    </nav>

  </div>

  <!-- মূল অ্যাপ্লিকেশন স্ক্রিপ্ট -->
  <script src="app.js"></script>
</body>
</html>
