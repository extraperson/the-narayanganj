<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Narayanganj - শহরের সবকিছু এক ঠিকানায়</title>
  
  <!-- বাংলা ফন্ট -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #0F5132;
      --primary-light: #E8F5E9;
      --accent: #E67E22;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text: #2C3E50;
      --text-muted: #7F8C8D;
      --border: #E2E8F0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #ECEFF1;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      position: relative;
      padding-bottom: 75px;
    }

    .header {
      background: #fff;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #0F5132, #1E824C);
      color: #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(15, 81, 50, 0.25);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 8px 16px;
      gap: 10px;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 14px;
      color: var(--text);
    }

    .banner {
      margin: 15px 20px 5px;
      background: linear-gradient(135deg, #0F5132 0%, #198754 100%);
      color: #fff;
      padding: 16px;
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .banner h3 {
      font-size: 16px;
      margin-bottom: 2px;
    }

    .banner p {
      font-size: 12px;
      opacity: 0.9;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin: 16px 20px 10px;
      color: var(--text);
    }

    /* ক্যাটাগরি গ্রিড (৮টি মূল বিভাগ) */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 20px 15px;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    .cat-btn i {
      font-size: 19px;
      color: var(--primary);
    }

    .cat-btn span {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .listings-container {
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .place-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .place-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .place-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .place-area {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .rating-badge {
      background: #FFF9E6;
      color: #F39C12;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 0;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-action:active {
      opacity: 0.8;
    }

    .btn-call {
      background: var(--primary);
      color: #fff;
    }

    .btn-map {
      background: #F1F5F9;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .loading-state i {
      font-size: 26px;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      background: #fff;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 700;
    }

    .nav-item i {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">N</div>
        <div>
          <div class="brand-title">The Narayanganj</div>
          <div class="brand-subtitle">শহরের সবকিছু এক ঠিকানায়</div>
        </div>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
        <input type="text" id="searchInput" placeholder="দোকান, পর্যটন, হাসপাতাল বা সেবা খুঁজুন...">
      </div>
    </header>

    <div class="banner">
      <div>
        <h3>নারায়ণগঞ্জের এ টু জেড</h3>
        <p>ইতিহাস, ব্যবসা, প্রশাসন ও প্রতিদিনের প্রয়োজনীয় তথ্য</p>
      </div>
      <i class="fa-solid fa-city" style="font-size: 32px; opacity: 0.9;"></i>
    </div>

    <h4 class="section-title">বিভাগ সমূহ</h4>
    <div class="categories-grid" id="categoryContainer">
      <div class="cat-btn active" onclick="filterCategory('সব')">
        <i class="fa-solid fa-border-all"></i>
        <span>সব</span>
      </div>
      <div class="cat-btn" onclick="filterCategory('জরুরি সেবা')">
        <i class="fa-solid fa-truck-medical"></i>
        <span>জরুরি</span>
      </div>
      <div class="cat-btn" onclick="filterCategory('চিকিৎসা')">
        <i class="fa-solid fa-hospital"></i>
        <span>চিকিৎসা</span>
      </div>
      <div class="cat-btn" onclick="filterCategory('শপিং ও ব্যবসা')">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>শপিং</span>
      </div>
      <div class="cat-btn" onclick="filterCategory('পর্যটন ও বিনোদন')">
        <i class="fa-solid fa-landmark"></i>
        <span>পর্যটন</span>
      </div>
      <div class="cat-btn" onclick="filterCategory('পরিবহন')">
        <i class="fa-solid fa-bus"></i>
        <span>পরিবহন</span>
      </div>
      <div class="cat-btn" onclick="filterCategory('প্রশাসন ও অফিস')">
        <i class="fa-solid fa-building-columns"></i>
        <span>প্রশাসন</span>
      </div>
      <div class="cat-btn" onclick="filterCategory('খাবার ও রেস্তোরাঁ')">
        <i class="fa-solid fa-utensils"></i>
        <span>খাবার</span>
      </div>
    </div>

    <h4 class="section-title" id="listTitle">সকল তথ্য</h4>
    <div class="listings-container" id="listings">
      <div class="loading-state">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <div>লোড হচ্ছে...</div>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i>হোম</a>
      <a href="#" class="nav-item"><i class="fa-solid fa-compass"></i>এক্সপ্লোর</a>
      <a href="#" class="nav-item"><i class="fa-solid fa-bookmark"></i>সংরক্ষণ</a>
      <a href="#" class="nav-item"><i class="fa-solid fa-circle-info"></i>পরিচিতি</a>
    </nav>
  </div>

  <script>
    const API_URL = "https://opensheet.elk.sh/1ctXswktft11lTCw_TiTbwoF2jgmLsHaf4Zno23QImjQ/Sheet1";
    let directoryData = [];
    let currentCategory = 'সব';

    function renderList(items) {
      const container = document.getElementById('listings');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = `<div class="loading-state">কোনো তথ্য খুঁজে পাওয়া যায়নি!</div>`;
        return;
      }

      items.forEach(item => {
        const name = item.name || 'তথ্য নেই';
        const area = item.area || 'নারায়ণগঞ্জ';
        const rating = item.rating || '৪.০';
        const phone = item.phone || '';
        const mapUrl = item.map_url || `https://maps.google.com/?q=${encodeURIComponent(name + ' ' + area)}`;

        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div class="place-header">
            <div>
              <div class="place-title">${name}</div>
              <div class="place-area"><i class="fa-solid fa-location-dot"></i> ${area}</div>
            </div>
            <div class="rating-badge">
              <i class="fa-solid fa-star"></i> ${rating}
            </div>
          </div>
          <div class="action-buttons">
            <a href="${phone ? 'tel:' + phone : '#'}" class="btn-action btn-call" ${!phone ? 'style="opacity:0.5;pointer-events:none;"' : ''}>
              <i class="fa-solid fa-phone"></i> ${phone ? 'কল করুন' : 'নম্বর নেই'}
            </a>
            <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="btn-action btn-map">
              <i class="fa-solid fa-diamond-turn-right"></i> ম্যাপ
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const text = btn.querySelector('span').innerText;
        btn.classList.toggle('active', text === cat || (cat === 'জরুরি সেবা' && text === 'জরুরি') || (cat === 'শপিং ও ব্যবসা' && text === 'শপিং') || (cat === 'পর্যটন ও বিনোদন' && text === 'পর্যটন') || (cat === 'প্রশাসন ও অফিস' && text === 'প্রশাসন') || (cat === 'খাবার ও রেস্তোরাঁ' && text === 'খাবার'));
      });
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = directoryData.filter(item => {
        const itemCat = (item.category || '').toLowerCase();
        const selectedCat = currentCategory.toLowerCase();
        
        let matchCat = (currentCategory === 'সব');
        if (!matchCat) {
          // পার্সিয়াল ম্যাচিং যাতে ক্যাটাগরি ফ্লেক্সিবল থাকে
          if (selectedCat.includes('জরুরি') && itemCat.includes('জরুরি')) matchCat = true;
          else if (selectedCat.includes('চিকিৎসা') && itemCat.includes('চিকিৎসা')) matchCat = true;
          else if (selectedCat.includes('শপিং') && (itemCat.includes('শপিং') || itemCat.includes('ব্যবসা') || itemCat.includes('মার্কেট'))) matchCat = true;
          else if (selectedCat.includes('পর্যটন') && (itemCat.includes('পর্যটন') || itemCat.includes('দর্শনীয়') || itemCat.includes('বিনোদন'))) matchCat = true;
          else if (selectedCat.includes('পরিবহন') && itemCat.includes('পরিবহন')) matchCat = true;
          else if (selectedCat.includes('প্রশাসন') && (itemCat.includes('প্রশাসন') || itemCat.includes('সরকারি') || itemCat.includes('অফিস'))) matchCat = true;
          else if (selectedCat.includes('খাবার') && (itemCat.includes('খাবার') || itemCat.includes('রেস্তোরাঁ') || itemCat.includes('হোটেল'))) matchCat = true;
          else matchCat = itemCat.includes(selectedCat);
        }
        
        const matchSearch = 
          (item.name || '').toLowerCase().includes(query) ||
          (item.area || '').toLowerCase().includes(query) ||
          (item.category || '').toLowerCase().includes(query) ||
          (item.address || '').toLowerCase().includes(query);

        return matchCat && matchSearch;
      });

      renderList(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    async function fetchSheetData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        if (Array.isArray(data) && data.length > 0) {
          directoryData = data;
          renderList(directoryData);
        } else {
          document.getElementById('listings').innerHTML = `
            <div class="loading-state">
              শিটে এখনো কোনো তথ্য পাওয়া যায়নি। অনুগ্রহ করে গুগল শিটে ডাটা যোগ করুন।
            </div>`;
        }
      } catch (err) {
        console.error("ডাটা ফেচ সমস্যা:", err);
        document.getElementById('listings').innerHTML = `
          <div class="loading-state" style="color: #c0392b;">
            ডাটা লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে ইন্টারনেট সংযোগ চেক করুন।
          </div>`;
      }
    }

    fetchSheetData();
  </script>
</body>
</html>
